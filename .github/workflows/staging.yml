name: Staging deployment (isolated)
on:
  push:
    branches: [main]
    paths:
      - ops/staging-deploy-request.txt
  workflow_dispatch:
    inputs:
      staging_database_uuid:
        description: "UUID of a SEPARATE ethicalcommerce-staging D1 database"
        required: true
        type: string
        default: '11d8e5ce-2bbb-491a-9099-b6e7085ea0a1'
      confirmation:
        description: "Type DEPLOY_STAGING_ONLY to confirm; live database is prohibited"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ethical-commerce-staging
  cancel-in-progress: false
jobs:
  staging:
    name: Deploy isolated staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'e01b58b8d08d2c97284b2a46a13f3815' }}
      STAGING_D1_UUID: ${{ github.event_name == 'push' && '11d8e5ce-2bbb-491a-9099-b6e7085ea0a1' || inputs.staging_database_uuid }}
      CONFIRM_STAGING: ${{ github.event_name == 'push' && 'DEPLOY_STAGING_ONLY' || inputs.confirmation }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require deployment credentials and explicit staging confirmation
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing Cloudflare deployment token secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing Cloudflare account ID secret"; exit 1; }
          test "$CONFIRM_STAGING" = "DEPLOY_STAGING_ONLY" || { echo "Staging deployment not confirmed"; exit 1; }
      - name: Install and check
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm run db:local
          npm run smoke
      - name: Generate isolated staging Worker configuration
        run: node scripts/prepare-staging.mjs
      - name: Verify staged Worker package
        run: npx wrangler deploy --dry-run --config wrangler.staging.toml
      - name: Apply migrations only to the separate staging D1
        run: npx wrangler d1 migrations apply ethicalcommerce-staging --remote --config wrangler.staging.toml
      - name: Deploy isolated staging Worker (resilient to transient failures)
        run: |
          for attempt in 1 2 3; do
            if npx wrangler deploy --config wrangler.staging.toml; then
              echo 'Staging Worker deployed successfully'
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 15))"
            fi
          done
          echo 'Cloudflare staging deployment failed after three attempts'
          exit 1
      - name: Completion
        run: echo 'Inspect the Wrangler deployment output for the staging URL.'
