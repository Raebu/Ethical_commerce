name = "ethical-commerce"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[triggers]
crons = ["*/15 * * * *"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "ethicalcommerce"
database_id = "5070811a-9990-4ae3-bd72-cf394ee63be6"
migrations_dir = "migrations"

[vars]
APP_NAME = "Ethical Commerce"
RUNTIME_TIER = "production"
